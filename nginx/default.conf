# 泡点江湖的反向代理。
# 这个文件最要紧的是 SSE 那一段——nginx 默认配置会把长连接搞坏：
#   proxy_buffering 默认开着 → 推送被缓存住，玩家看到的消息一卡一卡
#   proxy_read_timeout 默认 60s → 长连接每分钟被掐一次，全员反复掉线

upstream game {
    server game:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 真实 IP 传给后端，否则限流会把所有人当成同一个来源
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;

    client_max_body_size 64k;          # 这游戏没有上传，堵死大包
    server_tokens off;

    # SSE 长连接：以下四行少一行都会出问题
    location /api/events {
        proxy_pass http://game;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;            # 不缓冲，推送才实时
        proxy_cache off;
        proxy_read_timeout 3600s;       # 一小时不掐；客户端自己会重连
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://game;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # 留给以后上 HTTPS 用（有域名之后 certbot 会往这儿放验证文件）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

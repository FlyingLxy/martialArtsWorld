<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>泡點江湖 - 文字江湖聊天室</title>
<link rel="stylesheet" href="/css/main.css">

<div id="app">
  <div id="bar">
    <h1>泡點江湖</h1><span class="s" id="tag"></span>
    <span class="sp"></span>
    <a onclick="V.set('room')">场景</a><a onclick="V.set('bag')">行囊</a><a onclick="cmd('mail')" id="mailBtn">信箱</a><a onclick="cmd('who')">同道</a><a onclick="V.set('help')">玩法</a>
    <a onclick="night()">昼夜</a><a onclick="logout()">离开</a>
  </div>
  <div id="body">
    <div id="col1">
      <div class="pane" style="flex:none"><div class="cap">人物状态</div><div id="stat"></div></div>
      <div class="pane" style="flex:1"><div class="cap">江湖去处 <span id="onl"></span></div><div id="rooms"></div></div>
    </div>
    <div id="col2">
      <div id="scene" class="pane" style="overflow:visible"></div>
      <div class="pane" style="flex:1.15; display:flex; flex-direction:column">
        <div class="cap">江湖公共频道 <span>全服聊天 · 打斗 · 公告</span></div>
        <div id="pub"></div>
      </div>
      <div class="pane" style="flex:1; display:flex; flex-direction:column">
        <div class="cap">个人消息 <span>只有你看得见</span></div>
        <div id="me"></div>
      </div>
      <div id="inp">
        <div class="l1">
          <select id="ch">
            <option value="world">世界</option><option value="room">本地</option>
        <option value="sect">门派</option><option value="board">告示</option>
          </select>
          <input id="say" maxlength="120" placeholder="说点什么…（悄悄话：/对方名字 内容）" autocomplete="off">
          <button onclick="send()">发　言</button>
        </div>
        <div id="emo"></div>
      </div>
    </div>
    <div id="col3">
      <div class="pane" style="flex:none; max-height:56%"><div class="cap">此地人物 <span id="rn"></span></div><div id="people"></div></div>
      <div class="pane" style="flex:1"><div class="cap">江湖风云榜</div><div id="top"></div></div>
    </div>
  </div>
</div>

<div id="login">
  <div id="bar" style="border-bottom:2px solid var(--headb)"><h1>泡點江湖</h1><span class="s">登録</span></div>
  <div class="in">
    <div style="color:var(--dim); font-size:12px; margin-bottom:12px; line-height:1.9">
      大雪封山那年，你背着半袋干粮下了山，身无长物，只有一身使不完的力气。<br>
      —— 头一回来的，随便起个名号和暗号，敲回车就是注册。
    </div>
    <div>名号</div><input id="ln" maxlength="10" placeholder="如：令狐冲">
    <div>暗号</div><input id="lp" type="password" placeholder="记牢了，下回还用它">
    <div id="err"></div>
    <button onclick="login()">投　身　江　湖</button>
  </div>
</div>

<script src="/data.js"></script>
<script src="/js/net.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/actions.js"></script>
<script src="/js/views.js"></script>
<script src="/js/boot.js"></script>
